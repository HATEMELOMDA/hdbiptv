<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="index">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDB Hotel - Welcome</title>

  <!-- ملفات مشتركة -->
  <script src="js/i18n.js" defer></script>
  <script src="js/main.js" defer></script>
  
  <!-- ملفات خاصة بالترحيب -->
  <link rel="stylesheet" href="css/index.css">
  <script src="js/music.js" defer></script>
  <script src="js/controls.js" defer></script>
  <script src="js/offers.js" defer></script>
  <script src="js/index.js" defer></script>
</head>
<body class="index-page">
  <!-- لوجو -->
  <div class="logo-circle">
    <img src="assets/logo.png" alt="HDB Hotel Logo">
  </div>

  <!-- رسالة ترحيب -->
  <h1 class="welcome" data-lang="welcome"></h1>

  <!-- بيانات الغرفة -->
  <p class="info"><span data-lang="room"></span> <span id="room-number"></span></p>
  <p class="info"><span data-lang="time"></span> <span id="time"></span></p>
  <p class="info"><span data-lang="date"></span> <span id="date"></span></p>

  <!-- ملاحظة -->
  <p class="note" data-lang="continue"></p>

  <!-- زر موافق -->
  <button class="approve-btn" id="ok-btn" data-lang="ok"></button>

  <!-- أزرار اللغة -->
  <div class="lang-buttons">
    <button class="button" id="btn-en">English</button>
	<button class="button" id="btn-ar">العربية</button>
  </div>
</body>
</html>
