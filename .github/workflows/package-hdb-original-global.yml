name: Package HDB Global Hospitality V2

on:
  push:
    branches:
      - build/hospitality-alpha1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check js/hdb-global.js
          node --check js/hdb-runtime.js
          node --check js/hdb-services.js
          node --check js/hdb-dining.js
          node --check control/api-client.js
          node --check control/enterprise.js
          node --check control/login.js
          node --check control/control.js

      - name: Validate PHP
        run: |
          php -l api/bootstrap.php
          php -l api/security.php
          php -l api/setup.php
          php -l api/auth.php
          php -l api/index.php

      - name: Validate JSON
        run: |
          python -m json.tool api/data/state.json >/dev/null

      - name: Verify required files
        run: |
          test -f index.html
          test -f menu.html
          test -f tv.html
          test -f services.html
          test -f dining.html
          test -f messages.html
          test -f control/index.html
          test -f control/login.html
          test -f control/api-client.js
          test -f control/enterprise.js
          test -f api/index.php
          test -f api/auth.php
          test -f api/setup.php
          test -f css/hdb-global.css
          test -f js/hdb-global.js
          test -f js/hdb-runtime.js

      - name: Build ZIP
        run: |
          mkdir -p dist/HDBIPTV_GLOBAL_HOSPITALITY_V2
          rsync -a ./ dist/HDBIPTV_GLOBAL_HOSPITALITY_V2/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude 'platform-alpha1'
          cd dist
          zip -r HDBIPTV_GLOBAL_HOSPITALITY_V2.zip HDBIPTV_GLOBAL_HOSPITALITY_V2

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HDBIPTV_GLOBAL_HOSPITALITY_V2
          path: dist/HDBIPTV_GLOBAL_HOSPITALITY_V2.zip
          if-no-files-found: error
          retention-days: 90
